name: Docker image

# main          -> ghcr.io/<owner>/<repo>:rolling (+ :sha-<short>)
# tag vYYYY.M.N -> ghcr.io/<owner>/<repo>:vYYYY.M.N and :latest, then a GitHub release
#
# Build args come from repository variables (Settings -> Secrets and variables
# -> Actions -> Variables). Unset branding/feature variables fall back to the
# defaults in the Dockerfile.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
      build-args: ${{ steps.vars.outputs.build-args }}
    steps:
      - name: Validate version tag (v{year}.{month}.{release})
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v20[0-9]{2}\.(0?[1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match v{year}.{month}.{release}, e.g. v2026.10.1"
            exit 1
          fi

      - name: Image name and build args
        id: vars
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          BASE_HOST: ${{ vars.BASE_HOST }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_TITLE: ${{ vars.BRAND_TITLE }}
          BRAND_DESCRIPTION: ${{ vars.BRAND_DESCRIPTION }}
          BRAND_IMAGE_URL: ${{ vars.BRAND_IMAGE_URL }}
          BRAND_URL: ${{ vars.BRAND_URL }}
          ENABLE_SLACK: ${{ vars.ENABLE_SLACK }}
          ENABLE_SHAREPOINT: ${{ vars.ENABLE_SHAREPOINT }}
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          # Only pass variables that are set, so Dockerfile defaults still apply.
          {
            echo "build-args<<EOF"
            for name in BRAND_NAME BRAND_TITLE \
                        BRAND_DESCRIPTION BRAND_IMAGE_URL BRAND_URL ENABLE_SLACK ENABLE_SHAREPOINT; do
              if [ -n "${!name}" ]; then echo "${name}=${!name}"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: ${{ needs.prepare.outputs.build-args }}
          ulimit: nofile=65535:65535
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=rolling,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    if: github.ref_type == 'tag'
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          cat > notes.md <<NOTES
          ## Container image

          \`\`\`
          docker pull ${IMAGE}:${TAG}
          \`\`\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`. Also tagged \`latest\`.
          NOTES
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

  deploy-trigger:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_type == 'tag' && 'Prod' || github.ref == 'refs/heads/main' && 'Stage' || 'Dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 Deploy Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_API_URL: ${{ secrets.TRIGGER_API_URL }}
          ENV: ${{ github.ref_type == 'tag' && 'prod' || github.ref == 'refs/heads/main' && 'staging' }}
        run: |
          npx trigger.dev@4.7.4 deploy --env ${ENV} --external-id ${{ github.sha }}

  deploy:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_type == 'tag' && 'Prod' || github.ref == 'refs/heads/main' && 'Stage' || 'Dev' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Restart deployment via Lambda
        env:
          LAMBDA_URL: ${{ vars.RESTART_LAMBDA_URL }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          DEPLOYMENT: papermark
        run: |
          payload=$(jq -n --arg ns "$NAMESPACE" --arg d "$DEPLOYMENT" \
            '{namespace: $ns, deployment: $d}')

          curl --fail-with-body --silent --show-error \
            --aws-sigv4 "aws:amz:${AWS_REGION}:lambda" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            -H "content-type: application/json" \
            -d "$payload" \
            "$LAMBDA_URL"

